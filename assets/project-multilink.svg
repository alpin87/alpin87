<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="projBorderML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149">
        <animate attributeName="stop-color" values="#f85149;#36BCF7;#a371f7;#f85149" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#36BCF7">
        <animate attributeName="stop-color" values="#36BCF7;#a371f7;#f85149;#36BCF7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="3" y="3" width="894" height="164" rx="16" fill="#0d1117" stroke="url(#projBorderML)" stroke-width="2.5"/>

  <!-- ruby gem icon -->
  <g stroke="#f85149" stroke-width="4" fill="none" stroke-linejoin="round">
    <path d="M57 60 L101 60 L115 82 L79 116 L43 82 Z" fill="#490b12"/>
    <path d="M43 82 L115 82"/>
    <path d="M57 60 L67 82 L79 116"/>
    <path d="M101 60 L91 82 L79 116"/>
  </g>

  <!-- org line -->
  <text x="140" y="48" font-size="14" fill="#8b949e">
    <tspan fill="#f85149">◆</tspan>
    <tspan dx="6">coredev-official / multi-link · since 2026.07</tspan>
  </text>

  <!-- title -->
  <text x="140" y="82" font-size="20" font-weight="700" fill="#e6edf3">Tempick — 블록 기반 멀티링크 플랫폼</text>

  <!-- features -->
  <text x="140" y="112" font-size="14" fill="#8b949e">블록 페이지 빌더 · 어드민 / 수퍼어드민 · 퍼블릭 프로필 페이지 · Chrome 확장</text>

  <!-- stack -->
  <text x="140" y="142" font-size="14">
    <tspan fill="#f85149" font-weight="600">Rails 8</tspan>
    <tspan fill="#484f58" dx="6">·</tspan>
    <tspan fill="#ffd33d" dx="6" font-weight="600">Hotwire</tspan>
    <tspan fill="#484f58" dx="6">·</tspan>
    <tspan fill="#36BCF7" dx="6" font-weight="600">Tailwind</tspan>
    <tspan fill="#484f58" dx="6">·</tspan>
    <tspan fill="#4169e1" dx="6" font-weight="600">PostgreSQL</tspan>
    <tspan fill="#484f58" dx="10">—</tspan>
    <tspan fill="#8b949e" dx="10">Solid Queue / Cache / Cable · Kamal 배포</tspan>
  </text>

  <!-- building pill -->
  <g>
    <rect x="716" y="42" width="138" height="34" rx="17" fill="#9e6a03">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="738" cy="59" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="800" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">BUILDING</text>
  </g>
  <text x="798" y="100" text-anchor="middle" font-size="13" fill="#8b949e">진행 중 · 2026.07 ~</text>
</svg>
